var f = document.getElementById("my-form")

//Create and append the options
for (const parent in states_dictionary){

  f.appendChild(textNode);
  var selectList = document.createElement("select");
  selectList.id = parent;
  selectList.form = f.id
  selectList.name = parent

  document.write(parent)

    document.write(`\nop${child} ${states_dictionary[parent][child]}`)

    option.value = states_dictionary[parent][child];
    option.text = states_dictionary[parent][child];
    selectList.appendChild(option)
  }
  // document.body.insertBefore(selectList, currentDiv);
  f.appendChild(selectList)
}
