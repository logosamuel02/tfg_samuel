summary_atable:
  filename: Grouped table by level
  layout:
    height: 600
    template: plotly_white
    title_text: Table of accuracy grouped by Distribution and Ann
    width: 1000

anova_table:
  filename: ANOVA Table
  layout:
    template: &default_template
      seaborn
    title_text: ANOVA table

interaction_plot:
  filename: Interaction plot
  layout: &simple_layout
    template: *default_template

box_plot:
  filename: Box plot
  layout: *simple_layout

tuckey_test:
  filename: Post-hoc Tuckey Test
  layout:
    template: *default_template
    title_text: Post-hoc Tuckey Test

nemenyi_test:
  filename: Post-hoc Nemenyi Test
  layout:
    coloraxis_colorscale: Cividis
    template: *default_template
    title_text: Post-hoc Nemenyi Test

manova_table:
  filename: MANOVA table
  layout:
    template: *default_template
    title_text: MANOVA table
  
manova_table_intercept:
  filename: MANOVA table Intercept
  layout:
    template: *default_template
    title_text: MANOVA table Intercept

violin_plot:
  filename: Seconds to complete training round by agent
  layout:
    template: *default_template
    title_text: Seconds to complete training round by agent

execution_time_plot:
  filename: Total execution time by agent
  layout:
    template: *default_template
    title_text: Total execution time by agent
  traces:
    cliponaxis: false
    textangle: 0
    textfont_size: 12
    textposition: outside

bubble_plot:
  filename: Bubble plot data split
  axes:
    gridcolor: grey
    gridwidth: 1
    showgrid: true
  layout:
    plot_bgcolor: rgb(256,256,256)
    template: *default_template
  size_factors:
    height: 67
    max_bubble_size: 55
    min_bubble_size: 20
    width: 143

heatmap_messages:
  filename: Total messages sent between agents
  layout:
    template: *default_template
    title_text: Total messages sent between agents

heatmap_sizes:
  filename: Information (MB) sent between agents
  layout:
    template: *default_template
    title_text: Information sent between agents

statistics_messages:
  filename: Statistics by message type
  layout:
    template: *default_template
    title_text: Statistics by message type

distribution_messages:
  filename: Distribution of messages over time
  layout:
    template: *default_template
    title_text: Distribution of messages over time
  traces:
    marker_color: green

distribution_messages_types:
  filename: Distribution of messages over time by type
  layout:
    template: *default_template
    title_text: Distribution of messages over time by type

distribution_info:
  filename: Distribution of information over time
  layout:
    template: *default_template
    title_text: Distribution of information over time
  

distribution_info_type:
  filename: Distribution of information over time by message type
  layout:
    template: *default_template
    title_text: Distribution of information over time by message type

xy_scatter:
  filename: Scatter plot for a single layer
  layout:
    template: plotly_white

scatter_plot: 
  filename: Evolution of a sublayer (Scatter)

line_plot:
  filename: Evolution of a sublayer (Line)

combined_plot:
  filename: Evolution of a sublayer
  layout:
    template: plotly_white
  traces:
    line_width: 5
    marker_size: 25
  updatemenus:
    frame_duration: 120
    redraw: false
    transition_duration: 50
  xaxes:
    linewidth: 2
    tickwidth: 2
    title_font_size: 16
  yaxes:
    gridcolor: '#7a98cf'
    griddash: dot
    gridwidth: 0.5
    linewidth: 2
    tickwidth: 2

train_plot:
  filename: Train evolution across rounds by agent
  layout:
    template: *default_template

test_plot:
  filename: Test evolution across rounds by agent
  layout:
    template: *default_template

train_test_plot: 
  filename: Train and test evolution across rounds by metric
  layout:
    template: *default_template
  traces:
    mean_test_linecolor: rgb(231,107,243)
    mean_train_linecolor: rgb(0,176,246)
    test_fillcolor: rgba(231,107,243,0.2)
    test_linecolor: rgba(255,255,255,0)
    train_fillcolor: rgba(0,176,246,0.2)
    train_linecolor: rgba(255,255,255,0)

nodes_plot:
  filename: Network nodes evolution
  axes:
    showgrid: false
    showticklabels: false
    title: null
    zeroline: false
  layout:
    coloraxis_colorbar_x: -0.15
    height: 800
    template: plotly_white
    width: 800
  other:
    border: 0.07
    frame_duration: 50
    marker_size: 35
  traces:
    textfont_family: Arial Black
    textfont_size: 17
    textposition: top center

edges_plot:
  filename: Network edges evolution
  axes:
    showgrid: false
    showticklabels: false
    title: null
    zeroline: false
  layout:
    coloraxis_colorbar_x: -0.15
    height: 800
    template: plotly_white
    width: 800
  other:
    border: 0.07
    frame_duration: 50
    marker_size: 35
    max_size_lines: 20
    transition_duration: 25
  traces:
    textfont_size: 20

network_plot:
  filename: Network evolution 
  layout:
    template: plotly_white
  traces:
    marker:
      line_color: DarkSlateGrey
      opacity: 1
      size: 35

