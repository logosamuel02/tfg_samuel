<script>
async function httpGet(theUrl)
{   
    var xmlHttp = new XMLHttpRequest();
    xmlHttp.open( "GET", theUrl, false ); // false for synchronous request
    xmlHttp.send( null );
    return xmlHttp.responseText;
}

async function reload(theUrl, time)
{
    httpGet(theUrl)
    setInterval(httpGet(theUrl), time);
};

reload("http://localhost:10000/gen_anova", 30000)
reload("http://localhost:10000/manager/plots/anova", 10000)

</script>
